<title>Amaury's Quest</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080810;font-family:'Inter',system-ui,sans-serif;color:#eeeeff;overscroll-behavior:none;}
input,textarea{outline:none;color:#eeeeff;font-family:inherit;}
button{font-family:inherit;}
button:active{opacity:.75;transform:scale(.97);}
.btn3d:active{transform:translateY(3px)!important;box-shadow:0 0 0 rgba(0,0,0,0), inset 0 1px 0 rgba(255,255,255,0.15)!important;opacity:1!important;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:4px;}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes particle{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rotateSlow{to{transform:rotate(360deg)}}
@keyframes rotateSlowRev{to{transform:rotate(-360deg)}}
@keyframes bounceIn{0%{transform:scale(0) rotate(-15deg);opacity:0}55%{transform:scale(1.15) rotate(5deg);opacity:1}75%{transform:scale(.92) rotate(-2deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes fadeInBg{from{opacity:0}to{opacity:1}}
@keyframes fadeOutBg{from{opacity:1}to{opacity:0}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,-2px)}40%{transform:translate(3px,2px)}50%{transform:translate(-2px,1px)}60%{transform:translate(2px,-1px)}70%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}90%{transform:translate(-1px,0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes modalOut{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes parallaxDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes splashPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
@keyframes splashText{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashOut{from{opacity:1}to{opacity:0}}
@keyframes textPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes confettiFall{to{transform:translateY(420px) rotate(var(--rot));opacity:0}}
@keyframes rayPulse{0%,100%{opacity:.5}50%{opacity:1}}

function generateWeeklyChallenge(){
  const weekKey=getWeekKey();
  const d=new Date();
  const weekNum=Math.floor((d-new Date(d.getFullYear(),0,1))/(7*86400000));
  const cat=CAT_ORDER[weekNum%CAT_ORDER.length];
  const templates=CHALLENGE_TEMPLATES[cat]||CHALLENGE_TEMPLATES.discipline;
  const chosen=templates[weekNum%templates.length];
  return{
    weekKey,cat,
    id:chosen.id,label:chosen.label,habitId:chosen.habitId,
    goal:chosen.target,current:0,xpReward:chosen.xp,icon:chosen.icon,
    done:false,claimed:false,
  };
}

const computeGlobalScore=s=>{
  const cs={};
  const base=s.catBase||{};
  Object.keys(CATS).forEach(cat=>{
    const b=base[cat]!==undefined?base[cat]:50;
    const impact=s.activityImpacts?.[cat]||0;
    cs[cat]=Math.max(0,Math.min(100,Math.round(b+impact)));
  });
  const gs=Math.round(Object.values(cs).reduce((a,b)=>a+b,0)/Object.keys(CATS).length);
  return{cs,gs};
};

// Habits still track their own completion % for the Habitudes tab display (XP/streaks unaffected)
const computeHabitCompletion=s=>{
  const hc={};
  Object.keys(CATS).forEach(cat=>{
    const all=[...CORE.filter(h=>h.cat===cat),...BONUS.filter(h=>h.cat===cat)];
    if(!all.length){hc[cat]=0;return;}
    const tot=all.reduce((a,h)=>{
      if(h.unit==="check")return a+pct(Object.values(s.checklistProgress?.grooming||{}).filter(Boolean).length,h.goal);
      if(h.id==="sleep")return a+pct(calcSleep(s.sleepBedtime,s.sleepWake),SG);
      const pg=BONUS.find(b=>b.id===h.id)?(s.bonusProgress?.[h.id]||0):(s.coreProgress?.[h.id]||0);
      return a+pct(pg,h.goal);
    },0);
    hc[cat]=Math.round(tot/all.length);
  });
  return hc;
};

// Compute tomorrow's morning starting base per category: drift halfway toward 50 from today's end-of-day score
const computeNextDayBase=(cs)=>{
  const next={};
  Object.keys(CATS).forEach(cat=>{
    const today=cs[cat]??50;
    next[cat]=Math.round(today+(50-today)*0.4); // 40% drift toward neutral 50
  });
  return next;
};

const SegBar=({pct,color,segments=16,h=8})=>{
  const filled=Math.floor((pct/100)*segments);
  const partial=((pct/100)*segments)-filled;
  return<div style={{display:"flex",gap:2,height:h}}>
    {Array.from({length:segments}).map((_,i)=>{
      const isFull=i<filled;
      const isPartial=i===filled&&partial>0;
      return<div key={i} style={{flex:1,background:C.dim,borderRadius:2,overflow:"hidden",position:"relative"}}>
        {(isFull||isPartial)&&<div style={{position:"absolute",inset:0,background:color,borderRadius:2,width:isFull?"100%":`${partial*100}%`,boxShadow:`0 0 6px ${color}aa`,animation:isFull?`segPop .3s ease ${i*0.02}s both`:"none"}}/>}
      </div>;
    })}
  </div>;
};
const Lbl=({children})=><div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.sub,textTransform:"uppercase"}}>{children}</div>;
function CountUp({value,duration=700,decimals=0,suffix=""}){
  const[display,setDisplay]=useState(value);
  const prevRef=useRef(value);
  const rafRef=useRef(null);
  useEffect(()=>{
    const from=prevRef.current;
    const to=value;
    if(from===to){setDisplay(to);return;}
    const start=performance.now();
    const ease=t=>1-Math.pow(1-t,3); // ease-out cubic, smooth & premium
    const tick=now=>{
      const t=Math.min(1,(now-start)/duration);
      const eased=ease(t);
      const current=from+(to-from)*eased;
      setDisplay(current);
      if(t<1) rafRef.current=requestAnimationFrame(tick);
      else{setDisplay(to);prevRef.current=to;}
    };
    rafRef.current=requestAnimationFrame(tick);
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[value,duration]);
  const shown=decimals>0?display.toFixed(decimals):Math.round(display).toLocaleString();
  return<>{shown}{suffix}</>;
}

function Ring({value,size=64,strokeWidth=7,color,children,glow=false}){
  const r=(size-strokeWidth)/2;
  const circ=2*Math.PI*r;
  const offset=circ*(1-Math.max(0,Math.min(100,value))/100);
  return<div style={{position:"relative",width:size,height:size,flexShrink:0}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.dim} strokeWidth={strokeWidth}/>
      <circle
        cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={offset}
        style={{transition:"stroke-dashoffset .7s cubic-bezier(.22,.61,.36,1), stroke .4s ease",
          filter:glow?`drop-shadow(0 0 6px ${color}aa)`:"none"}}
      />
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
      {children}
    </div>
  </div>;
}

// ── LOCAL ACTIVITY ANALYSIS (keyword + duration) ──
function analyzeActivity(text){
  return new Promise(resolve=>{
    const t=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const Z={corps:0,nutrition:0,cerveau:0,apparence:0,discipline:0,social:0};

    // Extract duration in minutes — prioritize durations near duration-context words ("pendant", "durant")
    // and duration-shaped numbers, while avoiding false positives from clock times ("à 14h", "vers 23h")
    let mins=0;
    // Clock-time patterns to EXCLUDE from duration matching: "à 14h", "vers 23h", "de 8h à 9h" (schedule mentions)
    const clockTimePattern=/\b(a|à|vers|des|depuis)\s+\d+[\.,]?\d*\s*h\b/g;
    const excludedRanges=[];
    let cm;
    while((cm=clockTimePattern.exec(t))!==null){
      excludedRanges.push([cm.index,cm.index+cm[0].length]);
    }
    const isExcluded=(idx)=>excludedRanges.some(([s,e])=>idx>=s&&idx<e);

    const hMatches=[...t.matchAll(/(\d+[\.,]?\d*)\s*h(?:eures?)?\b/g)].filter(m=>!isExcluded(m.index));
    const mMatches=[...t.matchAll(/(\d+[\.,]?\d*)\s*min(?:utes?)?\b/g)].filter(m=>!isExcluded(m.index));
    const secMatches=[...t.matchAll(/(\d+[\.,]?\d*)\s*sec(?:ondes?)?\b/g)].filter(m=>!isExcluded(m.index));
    if(hMatches.length) mins+=parseFloat(hMatches[0][1].replace(",","."))*60;
    if(mMatches.length) mins+=parseFloat(mMatches[0][1].replace(",","."));
    if(secMatches.length) mins+=parseFloat(secMatches[0][1].replace(",","."))/60;
    if(mins===0) mins=30; // default if no duration found
    // Safety cap: no single logged activity is realistically longer than 6h — prevents any residual mis-extraction from exploding the multiplier
    mins=Math.min(mins,360);

    // Duration multiplier: base is 30min
    const mul=Math.min(mins/30, 6); // cap at 6x (3h)

    // Intensity detection for sport activities (léger/modéré/intense)
    const intenseWords=["intense","hiit","a fond","tres dur","très dur","killer","explosif","max effort","a bloc","à bloc"];
    const lightWords=["seance legere","séance légère","entrainement leger","tranquille","recup","récup","balade tranquille","seance facile","séance facile"];
    const isIntense=intenseWords.some(w=>t.includes(w));
    const isLight=lightWords.some(w=>t.includes(w));
    const sportIntensityMul=isIntense?1.35:isLight?0.7:1;

    // Late-night detection
    const lateNight=/\b(tard|nuit|minuit|3h|2h|1h du mat|insomnie)\b/.test(t);

    // === Bell-curve helper: score peaks at optimal range, tapers below and above ===
    // segments: array of {upTo (minutes), fn(minutes)->score 0..1} evaluated in order
    const bellCurve=(minutes,{lowEnd,optStart,optEnd,highEnd,plateauAfter})=>{
      if(minutes<=0)return 0;
      if(minutes<lowEnd) return (minutes/lowEnd)*0.25; // very little benefit below low threshold
      if(minutes<optStart) return 0.25+((minutes-lowEnd)/(optStart-lowEnd))*0.75; // ramping up to optimal
      if(minutes<=optEnd) return 1; // optimal plateau = full score
      if(minutes<highEnd) return 1-((minutes-optEnd)/(highEnd-optEnd))*0.3; // gentle taper past optimal
      if(plateauAfter) return 0.7; // plateaus, never penalized further
      return Math.max(0.4,0.7-((minutes-highEnd)/60)*0.15); // slow decline if excess is meaningfully penalized
    };

    // === SPECIAL CASE: Sieste checked FIRST (priority) to avoid fragile exclusion logic ===
    if(t.includes("sieste")){
      // short naps are good, long naps (>1h30) can disrupt night sleep — mild bell curve
      const score=bellCurve(mins,{lowEnd:10,optStart:20,optEnd:30,highEnd:90,plateauAfter:false});
      resolve({...Z,corps:Math.round(score*8),cerveau:Math.round(score*5)});
      return;
    }
    // === SPECIAL CASE: Night sleep (bell curve, Corps + light Cerveau, NOT Discipline) ===
    const sleepWords=["dormi","dors","sommeil","nuit de sommeil"];
    if(sleepWords.some(w=>t.includes(w))){
      // optimal 8-9h for an 18yo athletic male
      const score=bellCurve(mins,{lowEnd:180,optStart:480,optEnd:540,highEnd:600,plateauAfter:true}); // 3h low, 8-9h optimal, plateaus after 10h
      resolve({...Z,corps:Math.round(score*18),cerveau:Math.round(score*9)});
      return;
    }

    // === SPECIAL CASE: Gym/Muscu (bell curve, plateau after — never penalized for a long session) ===
    const gymWords=["gym","muscu","musculation","soulevé","haltere","kettlebell","barbell","bench","squat","deadlift","tractions","pompes","dips","abdos","gainage","planche","crossfit"];
    if(gymWords.some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:15,optStart:45,optEnd:90,highEnd:120,plateauAfter:true});
      const eff=score*sportIntensityMul;
      resolve({...Z,corps:Math.round(Math.min(20,eff*17)),cerveau:1,apparence:Math.round(eff*3),discipline:Math.round(eff*6)});
      return;
    }

    // === SPECIAL CASE: Cardio/Course (bell curve, plateaus after 60min) ===
    const cardioWords=["course","courir","jogging","sprint","cardio","run","hiit","velo","cyclisme","natation","nager","spinning"];
    if(cardioWords.some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:10,optStart:20,optEnd:45,highEnd:60,plateauAfter:true});
      const eff=score*sportIntensityMul;
      resolve({...Z,corps:Math.round(Math.min(20,eff*16)),cerveau:Math.round(eff*3),apparence:Math.round(eff*2),discipline:Math.round(eff*5)});
      return;
    }

    // === SPECIAL CASE: Marche (slow taper after 90min, never harshly penalized) ===
    const walkWords=["marche","marcher","balade","balader","promenade","promener","randonnee","randonner","hiking"];
    if(walkWords.some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:5,optStart:20,optEnd:60,highEnd:120,plateauAfter:true});
      const isHike=["randonnee","randonner","hiking"].some(w=>t.includes(w));
      resolve({...Z,corps:Math.round(score*(isHike?9:7)),cerveau:Math.round(score*(isHike?6:3)),discipline:Math.round(score*3)});
      return;
    }

    // === SPECIAL CASE: Étirements/Mobilité (short optimal window) ===
    const stretchWords=["etirement","etirer","stretching","souplesse","mobilite","pilates","yoga"];
    if(stretchWords.some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:5,optStart:10,optEnd:20,highEnd:40,plateauAfter:true});
      resolve({...Z,corps:Math.round(score*7),cerveau:Math.round(score*3),apparence:1,discipline:Math.round(score*4)});
      return;
    }

    // === SPECIAL CASE: Travail/Révisions (30min baseline, optimal 3-4h, plateaus after — mix Cerveau + Discipline) ===
    const workWords=["travail","travailler","bosser","bosse","boulot","stage","job","revision","révision","reviser","réviser","etude","étude","etudier","étudier","cours"];
    if(workWords.some(w=>t.includes(w))){

      resolve({...Z,cerveau:Math.round(score*13),discipline:Math.round(score*13)});
      return;
    }

    // === SPECIAL CASE: Méditation (tight optimal window, real diminishing returns past 20min) ===
    if(["meditation","mediter","pleine conscience","mindfulness"].some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:3,optStart:10,optEnd:20,highEnd:40,plateauAfter:true});
      resolve({...Z,corps:Math.round(score*2),cerveau:Math.round(score*7),discipline:Math.round(score*8)});

    }

    // === SPECIAL CASE: Lecture/Japonais/Codage/Écriture (gentle slowdown after 60-90min, never penalized) ===
    const deepFocusWords=["livre","lire","lu ","lecture","roman","bouquin","bd","manga","essai","japonais","kanji","hiragana","katakana","duolingo","coder","programmer","code","dev","javascript","python","ecrire","rediger","dissertation","poeme","poésie"];

    }

    // === SPECIAL CASE: Échecs/Jeux de réflexion (plateau after 45-60min mental fatigue) ===
    if(["echecs","chess","sudoku","puzzle","enigme","mots croises","scrabble"].some(w=>t.includes(w))){
      const score=bellCurve(mins,{lowEnd:5,optStart:20,optEnd:45,highEnd:60,plateauAfter:true});
      const isOnline=["echecs en ligne","chess.com","lichess"].some(w=>t.includes(w));
      resolve({...Z,cerveau:Math.round(score*10),discipline:Math.round(score*6),social:isOnline?Math.round(score*3):0});
      return;
    }

    // === SPECIAL CASE: Video games (nuanced by game type + duration + time of day) ===
    const competitiveGames=["fortnite","cod","call of duty","warzone","apex","valorant","lol","league of legends","overwatch","pubg"];
    const casualMobileGames=["brawl stars","clash royale","clash of clans","candy crush","subway surfer","mobile legends"];

    const isGaming=gamingWords.some(w=>t.includes(w))||competitiveGames.some(w=>t.includes(w))||casualMobileGames.some(w=>t.includes(w));
    if(isGaming){
      const isCompetitive=competitiveGames.some(w=>t.includes(w));
      const isCasualMobile=casualMobileGames.some(w=>t.includes(w));
      // base impact per 30 min — casual mobile games are mild, competitive console games hit harder
      let base=isCasualMobile?-2:isCompetitive?-6:-4;

        nutrition:0,
        cerveau:Math.round(Math.max(-20,cerveau)),

    const genericUnitDefaults={
      "part":250,"parts":250,"tranche":80,"tranches":80,
      "verre":200,"verres":200,"canette":330,"cannette":330,"portion":150,"portions":150,
    };
    const genericUnitMatches=[...t.matchAll(/(\d+[\.,]?\d*)\s*(part|parts|tranche|tranches|verre|verres|canette|cannette|portion|portions)\b/g)];
    // bare counts near a food word: "3 œufs", "1 kiwi", "2 sardines" — any number directly followed by words, matched against food.unit
    const bareCountMatches=[...t.matchAll(/(\d+[\.,]?\d*)\s+/g)];

    let macroTotals=null;
    if(gramMatches.length>0||genericUnitMatches.length>0||bareCountMatches.length>0){
      macroTotals={kcal:0,p:0,c:0,f:0,fi:0,su:0,matched:false};
      for(const food of FOOD_DB){
        for(const kw of food.k){
          const idx=t.indexOf(kw);
          if(idx===-1)continue;
          let bestGram=null,bestDist=Infinity;
          // 1) explicit grams/ml — must PRECEDE the food word (French: "400g de pâtes"), closest one wins
          for(const gm of gramMatches){
            const gEnd=gm.index+gm[0].length;
            if(gEnd<=idx){
              const dist=idx-gEnd;
              if(dist<bestDist&&dist<15){bestDist=dist;bestGram=parseFloat(gm[1].replace(",","."));}
            }
          }
          // 2) generic unit words (part/tranche/verre/canette) — same preceding rule
          if(bestGram===null){
            for(const um of genericUnitMatches){
              const uEnd=um.index+um[0].length;
              if(uEnd<=idx){
                const dist=idx-uEnd;
                if(dist<bestDist&&dist<15){
                  const qty=parseFloat(um[1].replace(",","."));
                  bestDist=dist;bestGram=qty*(genericUnitDefaults[um[2]]||150);
                }
              }
            }
          }
          // 3) bare count + this food's own per-unit weight ("3 œufs" -> 3 * 50g) — same preceding rule, tighter window
          if(bestGram===null&&food.unit){
            for(const bm of bareCountMatches){
              const bEnd=bm.index+bm[0].length;
              if(bEnd<=idx){
                const dist=idx-bEnd;
                if(dist<bestDist&&dist<10){
                  const qty=parseFloat(bm[1].replace(",","."));
                  bestDist=dist;bestGram=qty*food.unit;
                }
              }
            }
          }
          // 4) food mentioned with a defined unit weight but no number at all nearby -> assume "1"
          if(bestGram===null&&food.unit){bestGram=food.unit;}
          if(bestGram){
            const ratio=bestGram/100;
            macroTotals.kcal+=food.kcal*ratio;
            macroTotals.p+=food.p*ratio;
            macroTotals.c+=food.c*ratio;
            macroTotals.f+=food.f*ratio;
            macroTotals.fi+=food.fi*ratio;
            macroTotals.su+=food.su*ratio;
            macroTotals.matched=true;
          }
        }
      }
    }

    if(macroTotals&&macroTotals.matched){
      // Daily targets for Amaury: 18yo, 1m87, 72kg, lean bulk
      const T={kcal:2800,p:155,c:325,f:80,fi:30,suMax:50};

      // Calorie share of a meal: optimal = 1/4 to 1/3 of daily needs (~700-933 kcal), tapers past 1300 (oversized meal)
      const kcalScore=bellCurve(macroTotals.kcal,{lowEnd:150,optStart:700,optEnd:933,highEnd:1300,plateauAfter:false});

      // Protein: scored against ~35% of daily target in one meal = full mark
      const pScore=Math.min(1,macroTotals.p/(T.p*0.35));

      // Fiber: more is basically always fine, scored the same way
      const fiScore=Math.min(1,macroTotals.fi/(T.fi*0.35));

      // Fat: tighter optimal window (12-25g), tapers past 40g rather than plateauing — a very high-fat meal is genuinely less ideal
      const fatScore=bellCurve(macroTotals.f,{lowEnd:5,optStart:12,optEnd:25,highEnd:40,plateauAfter:false});

      // Sugar: pure penalty past a reasonable single-meal threshold
      const sugarPenalty=macroTotals.su>20?-Math.min(15,(macroTotals.su-20)*0.5):0;

      // Junk/processed food flag: grams alone can't capture "this is fast food" — layer a qualitative penalty on top
      const junkWords=["pizza","burger","fast food","mcdo","kebab","frite","frites","nuggets","chips","hot dog"];
      const junkPenalty=junkWords.some(w=>t.includes(w))?14:0;

      const nutritionImpact=Math.round(Math.max(-15,Math.min(20,
        kcalScore*8 + pScore*9 + fiScore*4 + fatScore*3 + sugarPenalty - junkPenalty
      )));
      resolve({
        ...Z,
        nutrition:nutritionImpact,
        corps:Math.round(nutritionImpact*0.25),
        _macros:{kcal:Math.round(macroTotals.kcal),p:Math.round(macroTotals.p),c:Math.round(macroTotals.c),f:Math.round(macroTotals.f),fi:Math.round(macroTotals.fi),su:Math.round(macroTotals.su)},
      });
      return;
    }

    // Activity database: {keywords[], impacts per 30min}
    const DB=[
      // === SPORT & CORPS (fallback — gym/cardio/marche/étirements/sommeil handled above with bell curves) ===
      {k:["foot","football","futsal","match"],i:{...Z,corps:10,cerveau:3,apparence:1,discipline:6,social:5},sport:true},
      {k:["basket","basketball","tennis","badminton","ping","pong","boxe","mma","judo","karate"],i:{...Z,corps:9,cerveau:2,apparence:1,discipline:6},sport:true},
      {k:["danse","danser"],i:{...Z,corps:8,cerveau:2,apparence:3,discipline:4,social:4},sport:true},

      // === NUTRITION (fallback for text without grams) ===
      {k:["cuisine","cuisiné","prépare","repas","fait a manger","cook"],i:{...Z,corps:2,nutrition:8,cerveau:3,apparence:1,discipline:6},nutriFallback:true},
      {k:["legume","legumes","salade","brocoli","carotte","epinard","courgette","tomate","concombre","poivron"],i:{...Z,corps:2,nutrition:10,apparence:3,discipline:3},nutriFallback:true},
      {k:["fruit","pomme","banane","orange","fraise","myrtille","mangue","kiwi","raisin"],i:{...Z,corps:2,nutrition:9,apparence:3,discipline:2},nutriFallback:true},
      {k:["proteine","poulet","dinde","boeuf","poisson","saumon","thon","oeuf","fromage blanc","yaourt","shake"],i:{...Z,corps:3,nutrition:9,apparence:2,discipline:3},nutriFallback:true},
      {k:["pizza","burger","fast food","mcdo","kebab","frite","chips","nuggets"],i:{...Z,corps:-4,nutrition:-8,apparence:-3,discipline:-5},nutriFallback:true},
      {k:["sucre","bonbon","gateau","chocolat","glace","dessert","viennoiserie"],i:{...Z,corps:-2,nutrition:-6,apparence:-2,discipline:-4},nutriFallback:true},
      {k:["alcool","biere","bière","du vin","verre de vin","cocktail","soiree arrosee","soirée arrosée"],i:{...Z,corps:-5,nutrition:-7,cerveau:-4,apparence:-3,discipline:-6},nutriFallback:true},
      {k:["de l'eau","d'eau","hydrat","bu de l'eau"],i:{...Z,corps:3,nutrition:5,cerveau:1,apparence:3,discipline:2},nutriFallback:true},

      // === CERVEAU (fallback — lecture/japonais/codage/echecs/meditation/travail handled above with bell curves) ===
      {k:["documentaire","docu","reportage"],i:{...Z,cerveau:8,discipline:3}},
      {k:["podcast educatif","podcast eduquant"],i:{...Z,cerveau:9,discipline:5}},
      {k:["podcast","conference","ted","ted talk","cours en ligne","mooc","formation","webinaire"],i:{...Z,cerveau:8,discipline:5}},
      {k:["dessin","dessiner","sketch","croquis","illustrer","illustré","aquarelle","peinture","peindre"],i:{...Z,cerveau:7,apparence:2,discipline:5}},
      {k:["apprendre la guitare","apprentissage guitare","apprendre le piano","apprentissage piano","cours de musique","gamme","solfege"],i:{...Z,cerveau:9,apparence:1,discipline:7}},
      {k:["music","musique","guitare","piano","instrument","jouer de","batterie","violon","chant","chanter"],i:{...Z,cerveau:7,apparence:1,discipline:6}},
      {k:["prier","priere","spirituel"],i:{...Z,cerveau:4,discipline:5}},
      {k:["géographie","histoire","science","biologie","physique","chimie","maths"],i:{...Z,cerveau:9,discipline:5}},

      // === APPARENCE / STYLE (flat punctual actions — no duration scaling, doing it once counts regardless of time spent) ===
      {k:["shopping","achat","achete","magasin","vetement","fringues","habit","tenue"],i:{...Z,cerveau:1,apparence:7,discipline:2},flat:true},
      {k:["coiffeur","coupe","cheveux"],i:{...Z,apparence:8,discipline:2},flat:true},
      {k:["soin","skincare","creme","masque visage","nettoyant"],i:{...Z,corps:1,apparence:9,discipline:4},flat:true},
      {k:["rasage","raser","rasé"],i:{...Z,apparence:6,discipline:3},flat:true},
      {k:["parfum","cologne"],i:{...Z,apparence:5,discipline:2},flat:true},
      {k:["douche","bain","laver"],i:{...Z,corps:2,apparence:7,discipline:3},flat:true},

      // === DISCIPLINE / PRODUCTIVITE ===
      {k:["ranger","nettoyé","nettoyage","ménage","aspirateur","vaisselle","chambre"],i:{...Z,corps:1,cerveau:1,apparence:2,discipline:7}},
      {k:["planifier","planning","organisation","organiser","objectif","agenda","todo"],i:{...Z,cerveau:4,discipline:9}},
      {k:["reveil","lever","debout","matin"],i:{...Z,corps:1,cerveau:1,discipline:7}},
      {k:["travail","bosser","boulot","stage","job"],i:{...Z,cerveau:5,discipline:8}},

      // === SOCIAL ===
      {k:["famille","parent","frere","soeur","grand-mere","grand-pere","cousin"],i:{...Z,cerveau:2,discipline:1,social:9}},
      {k:["ami","amis","copain","copine","pote","sortie","soiree","quedal","resto","restaurant"],i:{...Z,cerveau:1,apparence:1,social:9}},
      {k:["parle","discute","appel","appelé","conversation","retrouve"],i:{...Z,cerveau:2,social:7}},
      {k:["date","rdv amoureux","rendez-vous","rencard"],i:{...Z,apparence:3,social:9}},
      {k:["voyage","visite","musee","expo","culture","tourisme"],i:{...Z,corps:2,cerveau:7,apparence:1,discipline:3,social:3}},

      // === ACTIVITES NEGATIVES ===
      {k:["scroll","scroller","instagram","tiktok","snapchat","twitter","x ","reseaux","réseaux","feed","explore"],i:{...Z,corps:-3,cerveau:-8,apparence:-1,discipline:-12,social:-3}},
      {k:["netflix","serie","film","youtube","video","watch","regardé","regarder"],i:{...Z,corps:-1,cerveau:-2,discipline:-4}},
      {k:["fumer","cigarette","clope","tabac","weed","cannabis","joint"],i:{...Z,corps:-8,nutrition:-3,cerveau:-3,apparence:-4,discipline:-6}},
      {k:["paresse","glander","glande","rien","trainé","trainer","procrastine","procrastination"],i:{...Z,corps:-3,cerveau:-4,apparence:-1,discipline:-9}},
      {k:["dormi trop","oversleep","grasse matinee","grasse matinée"],i:{...Z,corps:-1,cerveau:-2,apparence:-1,discipline:-6}},
    ];

    // Find matching activity — for nutrition fallback entries specifically, SUM all matches
    // (so "repas" + "pizza" both apply, rather than one arbitrarily winning a tie)
    let nutritionSum=null;
    for(const entry of DB){
      if(!entry.nutriFallback)continue;
      if(entry.k.some(kw=>t.includes(kw))){
        if(!nutritionSum)nutritionSum={...Z};
        Object.keys(entry.i).forEach(k=>{nutritionSum[k]=(nutritionSum[k]||0)+entry.i[k];});
      }
    }
    if(nutritionSum){
      // Clamp each category to the same -20..20 range as everything else
      const clamped={};
      Object.keys(Z).forEach(k=>{clamped[k]=Math.round(Math.max(-20,Math.min(20,nutritionSum[k]||0)));});
      resolve(clamped);
      return;
    }

    let bestMatch=null, bestScore=0;
    for(const entry of DB){
      let score=0;
      for(const kw of entry.k){
        if(t.includes(kw)) score+=kw.length; // longer keyword = more specific = better match
      }
      if(score>bestScore){bestScore=score;bestMatch=entry;}
    }

    if(!bestMatch){
      // Unknown activity — neutral with slight discipline bonus
      resolve({...Z,cerveau:1,discipline:2});
      return;
    }

    // Apply duration multiplier (and intensity for sport entries) and round
    const raw=bestMatch.i;
    const effMul=bestMatch.flat?1:(bestMatch.sport?mul*sportIntensityMul:mul);
    const result={};
    for(const k of Object.keys(Z)){
      const v=(raw[k]||0)*effMul;
      result[k]=Math.round(Math.max(-20,Math.min(20,v)));
    }
    resolve(result);
  });
}

function Habits({s,update,showT,sp}){
  const[view,setView]=useState("core");

  const addP=(id,amt,isB=false,e)=>{
    if(e)sp(e.clientX,e.clientY);
    update(p=>{
      const key=isB?"bonusProgress":"coreProgress";
      const h=(isB?BONUS:CORE).find(x=>x.id===id);if(!h)return p;
      const cur=p[key]?.[id]||0,nxt=Math.min(cur+amt,h.goal);
      const wasD=cur>=h.goal,nowD=nxt>=h.goal;
      if(!wasD&&nowD){
        const st=(p.streaks?.[id]||0)+1,bon=st>=3?Math.floor(h.xp*.25*Math.min(st-2,5)):0,xg=h.xp+bon;
        const ex={};
        if(id==="gym"){ex.gymTotal=(p.gymTotal||0)+1;ex.gymStreak=(p.gymStreak||0)+1;}
        if(id==="water")ex.waterDays=(p.waterDays||0)+1;
        if(id==="onepiece")ex.onepieceTotal=(p.onepieceTotal||0)+amt;
        if(id==="wakeup")ex.wakeupStreak=(p.wakeupStreak||0)+1;
        if(id==="meditation")ex.meditationStreak=(p.meditationStreak||0)+1;
        if(id==="reading")ex.readingStreak=(p.readingStreak||0)+1;
        if(id==="tidy")ex.tidyStreak=(p.tidyStreak||0)+1;
        if(id==="protein"){ex.proteinDays=(p.proteinDays||0)+1;ex.proteinStreak=(p.proteinStreak||0)+1;}
        if(id==="veggies"){ex.veggieDays=(p.veggieDays||0)+1;ex.veggieStreak=(p.veggieStreak||0)+1;}
        setTimeout(()=>showT(`${h.icon} ${h.label} ✓ +${xg}XP${bon?` 🔥×${st}`:""}`,C.violet),10);
        let wc=p.weeklyChallenge;
        if(wc&&wc.habitId===id&&!wc.done){
          const newCur=wc.current+1;
          const nowDone=newCur>=wc.goal;
          wc={...wc,current:newCur,done:nowDone};
          if(nowDone)setTimeout(()=>showT(`🏆 Défi de la semaine complété ! Va réclamer ta récompense`,C.gold,4000),1200);
        }
        return{...p,[key]:{...p[key],[id]:nxt},xp:p.xp+xg,streaks:{...p.streaks,[id]:st},weeklyChallenge:wc,...ex};
      }
      return{...p,[key]:{...p[key],[id]:nxt}};
    });
  };

  const togChk=(i,e)=>{
    if(e)sp(e.clientX,e.clientY);
    update(p=>{
      const cur=p.checklistProgress?.grooming||{},nxt={...cur,[i]:!cur[i]};
      const done=Object.values(nxt).filter(Boolean).length;
      const wasD=Object.values(cur).filter(Boolean).length>=4,nowD=done>=4;
      const xg=(!wasD&&nowD)?30:0;
      if(!wasD&&nowD)setTimeout(()=>showT("✨ Routine apparence ✓ +30XP",C.amber),10);
      let wc=p.weeklyChallenge;
      if(!wasD&&nowD&&wc&&wc.habitId==="grooming"&&!wc.done){
        const newCur=wc.current+1,nowDone2=newCur>=wc.goal;
        wc={...wc,current:newCur,done:nowDone2};
        if(nowDone2)setTimeout(()=>showT("🏆 Défi de la semaine complété !",C.gold,4000),1200);
      }
      return{...p,checklistProgress:{grooming:nxt},xp:p.xp+xg,groomingStreak:(!wasD&&nowD)?(p.groomingStreak||0)+1:p.groomingStreak,weeklyChallenge:wc};
    });
  };

  const setSl=(f,v)=>update(p=>{
    const nb={...p,[f]:v};const sh=calcSleep(nb.sleepBedtime,nb.sleepWake);
    if(sh>=SG&&calcSleep(p.sleepBedtime,p.sleepWake)<SG){
      setTimeout(()=>showT("😴 Sommeil atteint ! +35XP",C.purple),10);
      let wc=p.weeklyChallenge;
      if(wc&&wc.habitId==="sleep"&&!wc.done){
        const newCur=wc.current+1,nowDone=newCur>=wc.goal;
        wc={...wc,current:newCur,done:nowDone};
        if(nowDone)setTimeout(()=>showT("🏆 Défi de la semaine complété !",C.gold,4000),1200);
      }
      return{...nb,xp:p.xp+35,sleepStreak:(p.sleepStreak||0)+1,weeklyChallenge:wc};
    }
    return nb;
  });

  const rH=(h,isB=false,idx=0)=>{
    const stagger={animation:`cardIn .4s cubic-bezier(.22,.61,.36,1) ${idx*0.06}s both`};
    if(h.unit==="check"){
      const chks=s.checklistProgress?.grooming||{},done=Object.values(chks).filter(Boolean).length,cmp=done>=h.goal;
      return<Crd key={h.id} style={{borderLeft:`3px solid ${cmp?C.emerald:h.color}`,...stagger}}>
        <HRow h={h} val={`${done}/${h.goal}`} complete={cmp} isBonus={isB}/>
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
          {h.checklist.map((item,i)=><button key={i} onClick={e=>togChk(i,e)} style={{background:chks[i]?"rgba(16,185,129,0.08)":C.surface,border:`1px solid ${chks[i]?C.emerald:C.border}`,borderRadius:10,padding:"9px 12px",cursor:"pointer",color:C.text,display:"flex",alignItems:"center",gap:10,fontSize:13}}>
            <div style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${chks[i]?C.emerald:C.muted}`,background:chks[i]?C.emerald:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:10}}>{chks[i]&&"✓"}</div>{item}
          </button>)}
        </div>
      </Crd>;
    }
    if(h.id==="sleep"){
      const sh=calcSleep(s.sleepBedtime,s.sleepWake),done=sh>=SG;
      return<Crd key="sleep" style={{borderLeft:`3px solid ${done?C.emerald:C.purple}`,...stagger}}>
        <HRow h={h} val={sh?`${sh}h`:"—"} complete={done} isBonus={false}/>
        <div style={{display:"flex",gap:10,marginTop:10}}>
          <div style={{flex:1}}><div style={{fontSize:10,color:C.sub,marginBottom:4}}>🌙 Coucher</div><input type="time" value={s.sleepBedtime||""} onChange={e=>setSl("sleepBedtime",e.target.value)} style={{...iS,width:"100%"}}/></div>
          <div style={{flex:1}}><div style={{fontSize:10,color:C.sub,marginBottom:4}}>☀️ Réveil</div><input type="time" value={s.sleepWake||""} onChange={e=>setSl("sleepWake",e.target.value)} style={{...iS,width:"100%"}}/></div>
        </div>
        {sh>0&&<div style={{marginTop:8}}><Br val={sh} max={SG} color={done?C.emerald:C.purple} glow/><div style={{fontSize:11,color:C.sub,marginTop:4}}>{sh}h / {SG.toFixed(1)}h</div></div>}
      </Crd>;
    }
    const pk=isB?"bonusProgress":"coreProgress",cur=s[pk]?.[h.id]||0,done=cur>=h.goal;
    return<Crd key={h.id} style={{borderLeft:`3px solid ${done?C.emerald:h.color}`,...stagger}}>
      <HRow h={h} val={h.unit==="bool"?(done?"✓":"—"):`${cur}${h.unit}`} complete={done} isBonus={isB}/>
      {h.unit!=="bool"&&<div style={{marginTop:8}}><Br val={cur} max={h.goal} color={done?C.emerald:h.color} glow={done}/></div>}
      {!done&&<div style={{display:"flex",gap:8,marginTop:10}}>
        <Btn onClick={e=>addP(h.id,h.step,isB,e)} color={h.color} full>+{h.step}{h.unit==="bool"?"":h.unit}</Btn>
        {h.unit!=="bool"&&h.step*2<=h.goal&&<Btn onClick={e=>addP(h.id,h.step*2,isB,e)} color={C.muted}>+{h.step*2}{h.unit}</Btn>}
      </div>}
      {done&&<div style={{marginTop:8,color:C.emerald,fontWeight:700,fontSize:12}}>✓ Complété !</div>}
    </Crd>;
  };

  return<div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      {["core","bonus"].map(v=><button key={v} onClick={()=>setView(v)} style={{background:view===v?C.purple:C.surface,color:view===v?"#fff":C.sub,border:`1px solid ${view===v?C.purple:C.border}`,borderRadius:20,padding:"7px 18px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{v==="core"?"Obligatoires":"✨ Bonus"}</button>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {view==="core"&&CORE.map((h,i)=>rH(h,false,i))}
      {view==="bonus"&&<><div style={{fontSize:12,color:C.sub,padding:"0 2px"}}>XP bonus — ne bloquent pas les récompenses.</div>{BONUS.map((h,i)=>rH(h,true,i))}</>}
    </div>
  </div>;
}

function Epic({s,update,showT}){
  const[adding,setAdding]=useState(false);
  const[label,setLabel]=useState("");const[ms,setMs]=useState("");const[xpv,setXpv]=useState("300");

  const setM=(qid,idx)=>update(p=>{
    const q=p.epicQuests.find(x=>x.id===qid);if(!q||(p.epicProgress?.[qid]||0)>idx)return p;
    const xp=Math.floor(q.xp/q.milestones.length);
    setTimeout(()=>showT(`⚔️ ${q.milestones[idx]} ! +${xp}XP`,C.fuchsia),10);
    return{...p,epicProgress:{...p.epicProgress,[qid]:idx+1},xp:p.xp+xp};
  });

  const add=()=>{
    if(!label.trim())return;
    const m=ms.split(",").map(x=>x.trim()).filter(Boolean);if(!m.length)m.push("Terminé !");
    update(p=>({...p,epicQuests:[...p.epicQuests,{id:"c_"+Date.now(),icon:"⭐",label,xp:parseInt(xpv)||300,milestones:m}]}));
    showT("Quête épique ajoutée !",C.gold);setAdding(false);setLabel("");setMs("");setXpv("300");
  };

  return<div style={{display:"flex",flexDirection:"column",gap:14}}>
    {s.epicQuests.map((q,qi)=>{
      const prog=s.epicProgress?.[q.id]||0,done=prog>=q.milestones.length;
      return<Crd key={q.id} style={{background:done?"linear-gradient(135deg,#1a1200,#1a1a28)":C.card,animation:`cardIn .4s cubic-bezier(.22,.61,.36,1) ${qi*0.07}s both`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:44,height:44,borderRadius:12,background:`${C.purple}20`,border:`1px solid ${C.purple}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{q.icon}</div>
            <div><div style={{fontWeight:700,fontSize:14}}>{q.label}</div><div style={{fontSize:11,color:C.sub}}>{q.xp} XP · {prog}/{q.milestones.length} étapes</div></div>
          </div>
          {done&&<span style={{fontSize:22}}>🏆</span>}
        </div>
        <Br val={prog} max={q.milestones.length} color={done?C.gold:C.fuchsia} glow={done}/>
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
          {q.milestones.map((m,i)=>{const r=prog>i,nx=prog===i;return<div key={i} style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>!r&&setM(q.id,i)} style={{width:28,height:28,borderRadius:"50%",flexShrink:0,border:`2px solid ${r?C.fuchsia:nx?"#fff":C.dim}`,background:r?C.fuchsia:"transparent",color:r?"#fff":nx?C.text:C.dim,cursor:r?"default":nx?"pointer":"not-allowed",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:r?`0 0 10px ${C.fuchsia}66`:"none"}}>{r?"✓":i+1}</button>
            <span style={{fontSize:13,color:r?C.text:nx?C.text:C.sub}}>{m}</span>
            {nx&&<span style={{fontSize:10,color:C.fuchsia,marginLeft:"auto",fontWeight:700}}>← Suivant</span>}
          </div>;})}
        </div>
      </Crd>;
    })}
    {!adding
      ?<button onClick={()=>setAdding(true)} style={{background:C.surface,border:`1px dashed ${C.muted}`,borderRadius:14,padding:16,color:C.sub,fontSize:13,cursor:"pointer",fontWeight:700}}>+ Ajouter une quête épique</button>
      :<Crd style={{animation:"modalIn .3s cubic-bezier(.22,.61,.36,1)",transformOrigin:"top center"}}><Lbl>NOUVELLE QUÊTE</Lbl><div style={{display:"flex",flexDirection:"column",gap:10,marginTop:10}}>
        <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Nom de la quête" style={{...iS,width:"100%"}}/>
        <input value={ms} onChange={e=>setMs(e.target.value)} placeholder="Étapes séparées par des virgules" style={{...iS,width:"100%"}}/>
        <input value={xpv} onChange={e=>setXpv(e.target.value)} placeholder="XP total" type="number" style={{...iS,width:"100%"}}/>
        <div style={{display:"flex",gap:8}}><Btn onClick={add} color={C.emerald} full>Ajouter</Btn><Btn onClick={()=>setAdding(false)} color={C.muted}>Annuler</Btn></div>
      </div></Crd>
    }
  </div>;
}

// ── HISTORY CHART ──
function HistoryChart({s,gs,cs}){
  const[range,setRange]=useState(7);
  const[cat,setCat]=useState("global");
  const hist=s.history||[];
  const catColor=cat==="global"?C.violet:(CATS[cat]?.color||C.violet);

  const getScoreFor=(entry,isToday)=>{
    if(cat==="global")return isToday?gs:entry?.score??null;
    if(isToday)return cs?.[cat]??null;
    return entry?.cats?.[cat]??null;
  };

  // Build the last N days including today
  const days=[];
  for(let i=range-1;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const key=fmtLocalDate(d);
    const isToday=key===TODAY();
    const found=hist.find(h=>h.date===key);
    days.push({date:key,score:getScoreFor(found,isToday),isToday});
  }

  const validDays=days.filter(d=>d.score!==null&&d.score!==undefined);
  const avg=validDays.length?Math.round(validDays.reduce((a,d)=>a+d.score,0)/validDays.length):0;
  const w=280,h=100,pad=8;
  const stepX=validDays.length>1?(w-pad*2)/(validDays.length-1):0;

  const points=validDays.map((d,i)=>{
    const x=pad+i*stepX;
    const y=pad+(h-pad*2)*(1-d.score/100);
    return{x,y,score:d.score,date:d.date,isToday:d.isToday};
  });

  const pathD=points.length>1?points.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" "):"";
  const areaD=points.length>1?`${pathD} L${points[points.length-1].x},${h-pad} L${points[0].x},${h-pad} Z`:"";

  return<Crd>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <Lbl>HISTORIQUE</Lbl>
      <div style={{display:"flex",gap:6}}>
        {[7,30].map(r=><button key={r} onClick={()=>setRange(r)} style={{background:range===r?catColor:C.surface,color:range===r?"#fff":C.sub,border:`1px solid ${range===r?catColor:C.border}`,borderRadius:16,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>{r}j</button>)}
      </div>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
      <button onClick={()=>setCat("global")} style={{background:cat==="global"?C.violet:C.surface,color:cat==="global"?"#fff":C.sub,border:`1px solid ${cat==="global"?C.violet:C.border}`,borderRadius:14,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>🌐 Global</button>
      {Object.entries(CATS).map(([k,c])=><button key={k} onClick={()=>setCat(k)} style={{background:cat===k?c.color:C.surface,color:cat===k?"#fff":C.sub,border:`1px solid ${cat===k?c.color:C.border}`,borderRadius:14,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>{c.icon} {c.label}</button>)}
    </div>
    <div style={{display:"flex",alignItems:"baseline",gap:8,margin:"10px 0 12px"}}>
      <span style={{fontSize:26,fontWeight:900,color:getScoreColor(avg)}}>{avg}%</span>
      <span style={{fontSize:11,color:C.sub}}>moyenne sur {range} jours</span>
    </div>
    {validDays.length<2?
      <div style={{textAlign:"center",padding:"20px 10px",color:C.sub,fontSize:12}}>Pas encore assez d'historique — reviens demain pour voir ta courbe !</div>
      :<svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:100,overflow:"visible"}}>
        <defs>
          <linearGradient id={`histGrad-${cat}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={catColor} stopOpacity="0.35"/>
            <stop offset="100%" stopColor={catColor} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[0,50,100].map(v=>{const y=pad+(h-pad*2)*(1-v/100);return<line key={v} x1={pad} y1={y} x2={w-pad} y2={y} stroke={C.border} strokeWidth="1" strokeDasharray="2,3"/>;})}
        {areaD&&<path d={areaD} fill={`url(#histGrad-${cat})`}/>}
        {pathD&&<path d={pathD} fill="none" stroke={catColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
        {points.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={p.isToday?4:2.5} fill={p.isToday?C.gold:catColor} stroke={C.bg} strokeWidth="1.5"/>)}
      </svg>
    }
    {validDays.length>=2&&<div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:9,color:C.sub}}>
      <span>{new Date(validDays[0].date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span>
      <span>Aujourd'hui</span>
    </div>}
  </Crd>;
}
