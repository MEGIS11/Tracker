<title>Amaury's Quest</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080810;font-family:'Inter',system-ui,sans-serif;color:#eeeeff;overscroll-behavior:none;}
input,textarea{outline:none;color:#eeeeff;font-family:inherit;}
button{font-family:inherit;}
button:active{opacity:.75;transform:scale(.97);}
.btn3d:active{transform:translateY(3px)!important;box-shadow:0 0 0 rgba(0,0,0,0), inset 0 1px 0 rgba(255,255,255,0.15)!important;opacity:1!important;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:4px;}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes particle{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rotateSlow{to{transform:rotate(360deg)}}
@keyframes rotateSlowRev{to{transform:rotate(-360deg)}}
@keyframes bounceIn{0%{transform:scale(0) rotate(-15deg);opacity:0}55%{transform:scale(1.15) rotate(5deg);opacity:1}75%{transform:scale(.92) rotate(-2deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes fadeInBg{from{opacity:0}to{opacity:1}}
@keyframes fadeOutBg{from{opacity:1}to{opacity:0}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,-2px)}40%{transform:translate(3px,2px)}50%{transform:translate(-2px,1px)}60%{transform:translate(2px,-1px)}70%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}90%{transform:translate(-1px,0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes modalOut{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes parallaxDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes splashPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
@keyframes splashText{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashOut{from{opacity:1}to{opacity:0}}
@keyframes textPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes confettiFall{to{transform:translateY(420px) rotate(var(--rot));opacity:0}}
@keyframes rayPulse{0%,100%{opacity:.5}50%{opacity:1}}
